[SystemSettings]
; Stalker2 Optimization v4.5 - preset 3 Ultimate (40-45 FPS) - RTX 3050 Laptop 4GB / Ryzen 5 5600H / 16GB / 2K
; Build by Pozdnyakov
; --- VRAM (4 GB): textures, Nanite and caches sized to avoid overflow ---
r.TextureStreaming=1
r.Streaming.PoolSize=1024
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.FullyLoadUsedTextures=0
r.Streaming.FramesForFullUpdate=5
r.Streaming.MaxNumTexturesToStreamPerFrame=8
r.Streaming.DefragDynamicBounds=1
r.Streaming.HLODStrategy=1
r.Streaming.MaxEffectiveScreenSize=1080
r.Streaming.MipBias=0.5
r.Nanite.Streaming.StreamingPoolSize=256
r.Nanite.Streaming.MaxPageInstallsPerFrame=32
; --- shaders: compile at start, draw new objects only when ready (no hitches) ---
r.ShaderPipelineCache.Enabled=1
r.ShaderPipelineCache.StartupMode=1
r.PSOWarmup.WarmupMaterials=1
r.PSOPrecaching=1
r.PSOPrecache.ProxyCreationWhenPSOReady=1
; --- NPC / streaming hitches ---
p.ClothPhysics=0
a.URO.Enable=1
r.SkeletalMeshLODBias=1
s.AsyncLoadingTimeLimit=2
s.ForceGCAfterLevelStreamedOut=0
s.LevelStreamingComponentsRegistrationGranularity=5
; --- upscaler (use TSR): dynamic resolution off (fixes stretched/smeared image bug) ---
r.DynamicRes.OperationMode=0
; --- latency ---
r.FinishCurrentFrame=0
r.OneFrameThreadLag=1
r.HZBOcclusion=1
r.AllowOcclusionQueries=1
; --- post effects ---
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.SceneColorFringeQuality=0
r.LensFlareQuality=0
r.Tonemapper.GrainQuantization=0
r.Tonemapper.Sharpen=0.8
r.ContactShadows=0
; --- sun shadows (classic shadow maps): sharp, no flickering squares from branches ---
r.Shadow.MaxCSMResolution=2048
r.Shadow.CSM.MaxCascades=4
r.SkyAtmosphere.FastSkyLUT=1
r.BloomQuality=3
; --- detail / distance ---
r.MaxAnisotropy=8
r.ViewDistanceScale=0.8
foliage.LODDistanceScale=0.5
foliage.DensityScale=0.5
grass.DensityScale=0.3
grass.CullDistanceScale=0.5
r.StaticMeshLODDistanceScale=1.5
r.Nanite.MaxPixelsPerEdge=2
r.EmitterSpawnRateScale=0.6
; --- lights: keep interior lamps, light functions and fire light ---
r.DetailMode=2
r.LightFunctionQuality=1
r.ParticleLightQuality=1
r.VolumetricFog=0
; --- global illumination: Lumen (lit interiors and basements) ---
r.DynamicGlobalIlluminationMethod=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.ScreenProbeGather.DownsampleFactor=16
r.Lumen.ScreenProbeGather.ShortRangeAO=0
r.Lumen.TraceMeshSDFs=1
r.DistanceFieldAO=0
; --- reflections: Lumen, only glossy surfaces traced (no grey/blue interiors) ---
r.ReflectionMethod=1
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.MaxRoughnessToTrace=0.3
r.Lumen.Reflections.DownsampleFactor=2
r.Lumen.Reflections.Temporal=1

[Core.Log]
LogStreaming=all off
LogPerformance=all off
LogRenderer=all off
